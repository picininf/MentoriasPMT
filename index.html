  const monthBars=O.map((m,i)=>{if(i>curM)return bar(m,0,0);const v=act.filter(a=>a.x.done.length>i).length;return bar(m,v,act.length)}).join('');
  const tot=MES.map((m,i)=>[m,all.reduce((n,a)=>n+a.x.by[i],0)]);const mx=Math.max(1,...tot.map(t=>t[1]));
  const dist=[0,1,2,3].map(d=>[d===3?'3+':d,act.filter(a=>d===3?a.x.deficit>=3:a.x.deficit===d).length]);
  const worst=act.filter(a=>a.x.deficit>0).sort((a,b)=>b.x.deficit-a.x.deficit).slice(0,8);
  return `<div class="grid">
  <div class="card kpi"><span class="mu">Alunos ativos</span><b>${act.length}</b><span class="mu">de ${all.length} · ${des} desistentes</span></div>
  <div class="card kpi"><span class="mu">Em dia</span><b style="color:var(--ok)">${act.length?Math.round(ok/act.length*100):0}%</b><span class="mu">${ok} alunos</span></div>
  <div class="card kpi"><span class="mu">Atrasados</span><b style="color:var(--er)">${late}</b><span class="mu">precisam recuperar</span></div>
  <div class="card kpi"><span class="mu">Com problema</span><b style="color:var(--er)">${act.filter(a=>a.s.problema).length}</b><span class="mu">relatados pelos alunos</span></div>
  <div class="card kpi"><span class="mu">Mentorias feitas</span><b>${done}</b><span class="mu">${sch} agendadas</span></div></div>
  <div class="g2"><div class="card"><h2>Alunos que já concluíram a Nª mentoria</h2><p class="mu" style="margin-top:-8px">Conta por ordem de mentoria, não por mês</p>${monthBars}</div>
  <div class="card"><h2>Volume de mentorias por mês (todos)</h2>${tot.map(([m,v])=>bar(m,v,mx,'var(--ac)').replace('/'+mx,'')).join('')}</div>
  <div class="card"><h2>Quantas mentorias faltam recuperar</h2><p class="mu" style="margin-top:-8px">Esperado até ${curM>=0?MES[curM]:'—'}: ${exp} por aluno</p>${dist.map(([l,v])=>bar(l+' falta'+(l==1?'':'m'),v,act.length,l==0?'var(--ok)':l==1?'var(--wa)':'var(--er)')).join('')}</div>
  <div class="card"><h2>⚠ Problemas relatados pelos alunos</h2>${all.filter(a=>a.s.problema||a.s.obsAluno).map(a=>`<div class="it" data-act="open" data-id="${a.s.id}" style="cursor:pointer;display:block"><b>${esc(a.s.name)}</b>${pp(a.s)}<div class="mu">${esc((a.s.obsAluno||'').slice(0,120))}</div></div>`).join('')||'<p class="mu">Nenhum relato até agora.</p>'}</div>
  <div class="card"><h2>📝 Observações da coordenação</h2>${all.filter(a=>a.s.obs).map(a=>`<div class="it" data-act="open" data-id="${a.s.id}" style="cursor:pointer;display:block"><b>${esc(a.s.name)}</b><div class="mu">${esc(a.s.obs)}</div></div>`).join('')||'<p class="mu">Nenhuma observação.</p>'}</div>
  <div class="card"><h2>Atenção prioritária</h2>${worst.length?worst.map(a=>`<div class="it" data-act="open" data-id="${a.s.id}" style="cursor:pointer"><span>${esc(a.s.name)}</span>${pill('atr',a.x.deficit)}</div>`).join(''):'<p class="mu">Ninguém atrasado 🎉</p>'}</div></div>`;
}
function list(){
  let a=S.students.map(s=>({s,x:st(s)}));
  const q=norm(S.q);if(q)a=a.filter(r=>norm(r.s.name).includes(q));
  if(S.filter==='prob')a=a.filter(r=>r.s.problema);else if(S.filter!=='todos')a=a.filter(r=>r.x.k===S.filter);
  a.sort((p,q)=>q.x.deficit-p.x.deficit||p.s.name.localeCompare(q.s.name));
  const chips=[['todos','Todos'],['atr','Atrasados'],['ok','Em dia'],['des','Desistentes'],['prob','⚠ Com problema']].map(([k,l])=>`<button class="chip ${S.filter===k?'on':''}" data-act="filter" data-k="${k}">${l}</button>`).join('');
  return `<div class="card"><div class="row" style="margin-bottom:12px"><input class="f" id="q" placeholder="Buscar aluno…" value="${esc(S.q)}">${chips}<button class="p" data-act="newtoggle">+ Aluno</button></div>
  ${S.newOpen?`<div class="row" style="margin-bottom:12px"><input class="f" id="nn" placeholder="Nome completo do novo aluno"><button class="p" data-act="newsave">Adicionar</button></div>`:''}
  <div class="sc"><table><tr><th>Aluno</th><th>Feitas</th><th>Situação</th><th>Observação</th><th style="min-width:230px">1ª → 10ª mentoria</th></tr>
  ${a.map(r=>`<tr class="c" data-act="open" data-id="${r.s.id}"><td>${esc(r.s.name)}</td><td>${r.x.done.length}/${exp}</td><td>${pill(r.x.k,r.x.deficit)}${pp(r.s)}</td><td class="mu" style="max-width:220px">${esc(r.s.obs||'')}</td><td>${heat(r.x)}</td></tr>`).join('')||'<tr><td colspan="5" class="mu">Nenhum aluno encontrado.</td></tr>'}</table></div></div>`;
}
function detail(s){
  const x=st(s),ro=S.edit;
  const items=x.ms.slice().reverse().map(m=>{
    if(ro===m.id)return `<div class="it"><div class="row"><input type="date" id="ed" value="${m.date}"><input class="f" id="en" value="${esc(m.note)}" placeholder="Observação (opcional)"></div><div class="row"><button class="p" data-act="esave" data-m="${m.id}">Salvar</button><button data-act="ecancel">Cancelar</button></div></div>`;
    const fut=m.date>=today;
    return `<div class="it"><div><b>${fd(m.date)}</b> ${fut?'<span class="pill wa">Agendada</span>':'<span class="pill ok">Realizada</span>'}${m.note?`<div class="mu">${esc(m.note)}</div>`:''}</div><div class="row"><button data-act="estart" data-m="${m.id}">Editar</button><button class="d" data-act="del" data-m="${m.id}">Remover</button></div></div>`;
  }).join('')||'<p class="mu">Nenhuma mentoria registrada ainda.</p>';
  const note=(s.problema||s.obsAluno)?`<div class="card" style="border-color:var(--er)"><h2>${S.admin?'Relato do aluno':'Sua observação'}${s.obsAt?` <span class="mu">· ${fd(s.obsAt)}</span>`:''}</h2>${s.problema?'<p style="margin:0 0 6px"><b>Marcado como: tem problemas na mentoria</b></p>':''}${s.obsAluno?`<p style="margin:0;white-space:pre-wrap">${esc(s.obsAluno)}</p>`:''}</div>`:'';
  const late=x.k==='atr'?`<div class="card" style="background:var(--${x.deficit>=3?'erb':'wab'})">Faltam <b>${x.deficit}</b> mentoria(s) para ficar em dia (esperado até ${MES[curM]}: ${exp}). Agende para recuperar!</div>`:'';
  return `<div class="top"><div><h1>${esc(s.name)}</h1><span class="mu">Turma ${esc(s.turma||'-')}</span> ${pill(x.k,x.deficit)}${pp(s)}</div>
  <div class="row">${S.admin?`<button data-act="back">← Voltar</button><button class="${s.problema?'d':''}" data-act="ptoggle">${s.problema?'Remover sinalização de problema':'⚠ Sinalizar problema'}</button><button data-act="toggle">${s.status==='desistente'?'Reativar aluno':'Marcar desistente'}</button>`:`<button class="${s.problema?'d':''}" data-act="mopen">⚠ Relatar problema / observação</button><button data-act="logout">Sair</button>`}</div></div>
  ${note}${S.admin?`<div class="card"><h2>📝 Observações da coordenação</h2><textarea id="ao" placeholder="Anotações internas sobre este aluno…">${esc(s.obs||'')}</textarea><div class="row" style="margin-top:8px"><button class="p" data-act="osave">Salvar observação</button><span class="mu">Visível só para o admin</span></div></div>`:''}${late}<div class="card"><h2>Mentorias por ordem (1ª a 10ª)</h2>${heat(x,true)}<p class="mu">Verde = realizada · Tracejado = agendada · Vermelho = mentoria que já deveria ter sido feita.</p></div>
  <div class="card"><h2>Adicionar mentoria</h2><div class="row"><input type="date" id="nd" min="2026-03-01" max="2026-12-31" value="${today<'2026-03-01'||today>'2026-12-31'?'':today}"><input class="f" id="nn2" placeholder="Observação (opcional)"><button class="p" data-act="add">Adicionar</button></div>${S.err?`<div class="err">${esc(S.err)}</div>`:''}<p class="mu">Hoje e datas futuras ficam como “agendada”; a partir do dia seguinte viram “realizada”.</p></div>
  ${S.modal&&!S.admin?`<div class="ov"><div class="card"><h2>Observação sobre suas mentorias</h2>
  <label class="rd"><input type="radio" name="pb" value="1" ${s.problema?'checked':''}> <span><b>Tenho problemas na mentoria</b><br><span class="mu">Você será sinalizado(a) para a coordenação</span></span></label>
  <label class="rd"><input type="radio" name="pb" value="0" ${s.problema?'':'checked'}> <span>Está tudo certo, só quero deixar uma observação</span></label>
  <textarea id="po" placeholder="Ex.: meu mentor não responde, não consigo horário…">${esc(s.obsAluno||'')}</textarea>
  <div class="row" style="margin-top:10px;justify-content:flex-end"><button data-act="mclose">Cancelar</button><button class="p" data-act="msave">Salvar</button></div></div></div>`:''}
  <div class="card"><h2>Histórico (${x.done.length} realizadas${x.next.length?`, ${x.next.length} agendadas`:''})</h2>${items}</div>`;
}
function login(){
  return `<div class="ov"><div class="card"><h1>👋 Bem-vindo(a)</h1><p class="mu">Mentorias PMT 26 · digite seu <b>nome completo</b> para acessar seu histórico.</p>
  <div class="row"><input class="f" id="ln" placeholder="Nome completo" autocomplete="off"><button class="p" data-act="login">Entrar</button></div>${S.err?`<div class="err">${esc(S.err)}</div>`:''}</div></div>`;
}
function render(){
  const a=document.getElementById('app');
  if(!db){a.innerHTML='<div class="card">Entre na sua conta Claude para acessar o painel.</div>';return}
  if(!S.loaded){a.innerHTML='<p class="mu">Carregando…</p>';return}
  let h='';const cur=S.students.find(s=>s.id===(S.admin?S.open:S.me));
  if(S.admin){
    h=`<div class="top"><h1>Painel de Mentorias · PMT 26</h1><div class="row"><span class="mu">Admin · ${pad(now.getDate())}/${pad(now.getMonth()+1)}/${now.getFullYear()}</span><button data-act="logout">Sair</button></div></div>`;
    if(cur)h+=detail(cur);
    else{h+=`<div class="tabs"><button class="${S.tab==='geral'?'on':''}" data-act="tab" data-k="geral">Visão geral</button><button class="${S.tab==='alunos'?'on':''}" data-act="tab" data-k="alunos">Alunos</button></div>`;
      h+=!S.students.length?`<div class="card"><p>Banco vazio. ${S.err?esc(S.err):''}</p><button class="p" onclick="importSeed()">Importar os 32 alunos iniciais</button></div>`:S.tab==='geral'?overview():list()}
  }else h=cur?detail(cur):login();
  a.innerHTML=h;const l=document.getElementById('ln');if(l)l.focus();
}
function user_save(s,ms){return db.doc('students/'+s.id).update({mentorias:ms}).catch(e=>{S.err='Erro ao salvar: '+(e.message||e);render()})}
function curS(){return S.students.find(s=>s.id===(S.admin?S.open:S.me))}
const uid=()=>'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,s=curS(),g=id=>document.getElementById(id);
  S.err='';
  if(a==='tab'){S.tab=b.dataset.k;S.open=null}
  else if(a==='filter')S.filter=b.dataset.k;
  else if(a==='open'){S.open=b.dataset.id;S.edit=null}
  else if(a==='osave'&&s)db.doc('students/'+s.id).update({obs:g('ao').value.trim()});
  else if(a==='ptoggle'&&s)db.doc('students/'+s.id).update({problema:!s.problema});
  else if(a==='mopen')S.modal=true;
  else if(a==='mclose')S.modal=false;
  else if(a==='msave'){const pr=(document.querySelector('input[name=pb]:checked')||{}).value==='1',o=g('po').value.trim();S.modal=false;db.doc('students/'+s.id).update({problema:pr,obsAluno:o,obsAt:today}).catch(e=>{S.err='Erro ao salvar: '+(e.message||e);render()})}
  else if(a==='back'){S.open=null;S.edit=null}
  else if(a==='newtoggle')S.newOpen=!S.newOpen;
  else if(a==='newsave'){const n=g('nn').value.trim().replace(/\s+/g,' ');if(n.split(' ').length<2){S.err='Informe o nome completo.'}else{const id=slug(n);db.doc('students/'+id).set({name:n,turma:'M',status:'ativo',obs:'',mentorias:[]});S.newOpen=false}}
  else if(a==='login'){const n=norm(g('ln').value),f=S.students.filter(x=>norm(x.name)===n);
    if(g('ln').value.trim()==='Swgxin100708ab'){S.admin=true;S.open=null;S.tab='geral';try{localStorage.setItem('pmt_me','__adm__')}catch(_){}}else if(f.length===1){S.me=f[0].id;try{localStorage.setItem('pmt_me',S.me)}catch(_){}}else S.err='Nome não encontrado. Digite o nome completo, como na lista da turma.'}
  else if(a==='logout'){S.me=null;S.modal=false;S.admin=false;S.open=null;S.edit=null;try{localStorage.removeItem('pmt_me')}catch(_){}}
  else if(s){
    const ms=(s.mentorias||[]).slice();
    if(a==='add'){const d=g('nd').value;if(!d)S.err='Escolha uma data.';else if(d<'2026-03-01'||d>'2026-12-31')S.err='A data deve estar entre março e dezembro de 2026.';else{ms.push({id:uid(),date:d,note:g('nn2').value.trim()});user_save(s,ms)}}
    else if(a==='estart')S.edit=b.dataset.m;
    else if(a==='ecancel')S.edit=null;
    else if(a==='esave'){const d=g('ed').value,m=ms.find(x=>x.id===b.dataset.m);if(!d||d<'2026-03-01'||d>'2026-12-31')S.err='Data inválida (março a dezembro de 2026).';else{m.date=d;m.note=g('en').value.trim();S.edit=null;user_save(s,ms)}}
    else if(a==='del'){if(confirm('Remover esta mentoria?'))user_save(s,ms.filter(x=>x.id!==b.dataset.m))}
    else if(a==='toggle')db.doc('students/'+s.id).update({status:s.status==='desistente'?'ativo':'desistente'});
  }
  render();
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ln')document.querySelector('[data-act=login]').click()});
db={doc:p=>{const[c,i]=p.split('/');const ref=doc(fdb,c,i);return{update:o=>updateDoc(ref,o),set:o=>setDoc(ref,o)}}};
try{const m=localStorage.getItem('pmt_me');if(m==='__adm__')S.admin=true;else S.me=m}catch(_){}
onSnapshot(collection(fdb,'students'),snap=>{
  S.students=snap.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;
  const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA')&&ae.id!=='q'&&!ae.id.startsWith('ln'))return;
  render();
},e=>{S.err='Erro ao conectar ao banco: '+e.message;S.loaded=true;render()});
window.importSeed=async()=>{if(!confirm('Importar os 32 alunos iniciais?'))return;const b=writeBatch(fdb);Object.entries(SEED).forEach(([id,d])=>b.set(doc(fdb,'students',id),d));await b.commit()};
render();
</script></body></html>
